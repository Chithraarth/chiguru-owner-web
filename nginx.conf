server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Landing page at "/", legal pages at /terms, /privacy and /delete-account
    # (each a folder with its own index.html). Any old web-app path lands on
    # the landing page.
    location / {
        try_files $uri $uri/index.html /index.html;
    }

    # Always fetch the service worker fresh so the clean-up worker reaches
    # browsers that still have the old web app cached.
    location = /sw.js {
        add_header Cache-Control "no-cache";
        try_files $uri =404;
    }
}
